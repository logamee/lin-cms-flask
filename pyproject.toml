[project]
name = "app"
version = "0.7.0"
description = "🎀A simple and practical CMS implemented by flask"
requires-python = ">=3.11,<3.15"
authors = [
    {name = "sunlin92", email = "sun.melodies@gmail.com"}
]
dependencies = [
    "Flask>=3.1.3",
    "Flask-JWT-Extended>=4.7.4",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.0.49",
    "WTForms>=3.2.2",
    "tablib>=3.10.0",
    "spectree>=3.0.0,<4.0.0",
    "pillow>=12.3.0",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "gevent>=26.9.0",
    "blinker>=1.9.0",
    "python-dotenv>=1.2.4",
    "pydantic[email]>=2.12.5,<3.0.0",
    "flask-limiter>=4.1.1",
    "flask-migrate>=4.1.0",
]

[project.optional-dependencies]
mysql = [
    "PyMySQL>=1.2.3",
]
postgres = [
    "psycopg[binary]>=3.3.6",
]

# 开发工具链走 PEP 735 dependency-groups（uv sync 默认安装，uv export 默认不含），
# 与生产依赖分离：requirements.txt 仅锁运行时依赖
[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "watchdog>=6.0.0",
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pre-commit>=4.7.0",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"


[tool.isort]
profile = "black"
multi_line_output = 3
force_grid_wrap = 0
line_length = 120
use_parentheses = true
include_trailing_comma = true

[tool.black]
line_length = 120

[tool.mypy]
files = ["app", "starter.py", "tests"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# SQLAlchemy 声明式基类/动态属性属于框架魔法，mypy 无法静态理解
module = ["app.lin.db", "app.lin.interface"]
disable_error_code = ["name-defined", "assignment", "misc", "valid-type", "arg-type", "attr-defined"]

[[tool.mypy.overrides]]
# 种子数据/CLI 中的模型属性赋值同为 SQLAlchemy 动态模式
module = ["app.plugin.poem.app", "app.cli.db.fake"]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/config/*", "app/plugin/*"]

[tool.coverage.report]
show_missing = true
# 覆盖率门槛：当前 73%，取整设 70% 防回退，后续逐步上调
fail_under = 70
